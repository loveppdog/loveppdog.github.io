# 站点信息
title: "ppdog 学习笔记"
description: "自动驾驶与机器人技术每日学习记录"
baseurl: ""
url: "https://loveppdog.github.io"

# 作者信息
author: "ppdog"
email: "your-email@example.com"
github_username: "loveppdog"

# 导航配置
navigation:
  - title: "首页"
    url: "/"
    icon: "home"
  - title: "文章"
    url: "/posts/"
    icon: "newspaper"
  - title: "分类"
    url: "/categories/"
    icon: "folder"
  - title: "标签"
    url: "/tags/"
    icon: "tags"

# 启用页面集合
collections:
  pages:
    output: true
    permalink: /:path/

# 默认页面布局
defaults:
  - scope:
      path: "_pages"
      type: "pages"
    values:
      layout: "page"
  
theme: jekyll-theme-minimal
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

# 访客统计配置
busuanzi:
  enable: true
  site_pv: true      # 显示站点总访问量
  page_pv: true      # 显示页面访问量
  site_uv: true      # 显示站点访客数

# 评论系统配置
gitalk:
  enable: true
  clientID: "Ov23liIQY8vnLT4cX4Oy"      # 从GitHub获取
  clientSecret: "116323e4f3cfa35c251255a38f89ccaae99669f8"     # 从GitHub获取
  repo: "loveppdog.github.io"
  owner: "loveppdog"
  admin: "loveppdog"
  language: "zh-CN"
  perPage: 10
  pagerDirection: "last"
  createIssueManually: false
  distractionFreeMode: false