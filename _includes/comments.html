<!-- 评论组件 -->
<div id="comments" class="comments-section">
  <h3>
    <i class="fas fa-comments"></i>
    {% if site.data.comments[page.slug].size > 0 %}
      评论 ({{ site.data.comments[page.slug] | size }})
    {% else %}
      发表评论
    {% endif %}
  </h3>
  
  <!-- Gitalk评论容器 -->
  <div id="gitalk-container"></div>
  
  <!-- 备用Disqus评论（可选） -->
  <div id="disqus_thread" style="display: none;"></div>
</div>

<!-- 引入Gitalk -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/gitalk@1/dist/gitalk.css">
<script src="https://cdn.jsdelivr.net/npm/gitalk@1/dist/gitalk.min.js"></script>

<script>
// 动态加载评论系统
function loadComments() {
  // 检查是否启用了Gitalk
  {% if site.gitalk.enable %}
    const gitalk = new Gitalk({
      clientID: '{{ site.gitalk.clientID }}',
      clientSecret: '{{ site.gitalk.clientSecret }}',
      repo: '{{ site.gitalk.repo }}',
      owner: '{{ site.gitalk.owner }}',
      admin: ['{{ site.gitalk.admin }}'],
      id: '{{ page.url | slugify }}',  // 确保唯一
      title: '{{ page.title }}',
      body: '{{ page.url | absolute_url }}',
      language: '{{ site.gitalk.language | default: "zh-CN" }}',
      perPage: {{ site.gitalk.perPage | default: 10 }},
      distractionFreeMode: {{ site.gitalk.distractionFreeMode | default: false }},
      createIssueManually: {{ site.gitalk.createIssueManually | default: false }},
      labels: ['gitalk', '{{ page.title }}']
    })
    gitalk.render('gitalk-container')
  {% endif %}
}

// 页面加载完成后初始化评论
document.addEventListener('DOMContentLoaded', loadComments)
</script>

<style>
.comments-section {
  margin-top: 40px;
  padding-top: 20px;
  border-top: 1px solid #e1e4e8;
}

.comments-section h3 {
  color: #24292e;
  margin-bottom: 20px;
  display: flex;
  align-items: center;
  gap: 10px;
}

.comments-section h3 i {
  color: #0366d6;
}

/* Gitalk样式调整 */
.gt-container .gt-header-textarea {
  background: #f6f8fa;
  border: 1px solid #e1e4e8;
}

.gt-container .gt-btn {
  background: #0366d6;
  border-color: #0366d6;
}

.gt-container .gt-btn-preview {
  background: #f6f8fa;
  color: #24292e;
  border-color: #e1e4e8;
}
</style>
